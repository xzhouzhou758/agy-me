# /opt/agy-me/cpa/config.yaml  (chmod 600) - CLIProxyAPI v8 for agy-me, single user.
# Replace the two CHANGE-ME values. CPA hashes management.secret-key in place on first start, so keep the plain
# key in agy-me.env (CPA_MANAGEMENT_KEY) - that is the only copy agy-me needs.
config-version: 8

models:
  catalog: /CLIProxyAPI/catalog/models.json

server:
  host: "127.0.0.1"      # host network / compose network: only reachable through agy-me or nginx
  port: 8318

management:
  allow-remote: false
  secret-key: "CHANGE-ME-same-as-CPA_MANAGEMENT_KEY"
  disable-control-panel: false  # served by agy-me under /me/cpa/ (agy-me injects the management key)

access:
  api-keys:              # what clients (SillyTavern / Luker etc.) send as their API key
    - "CHANGE-ME-client-key"

routing:
  retry:
    request-retry: 3
    max-retry-credentials: 0
    max-retry-interval: 30
  cooldown:
    disable-cooling: false

requests:
  streaming:
    keepalive-seconds: 15
    bootstrap-retries: 1
    send-keepalive-before-ft: true
  # Thinking tiers for the aliases below: xxx-low / xxx-medium get fixed level or budget, plain xxx uses dynamic budget.
  payload:
    default:
      - models:
          - name: "gemini-4-hydrogen"
            protocol: "antigravity"
            not-exist: ["generationConfig.thinkingConfig"]
          - name: "gemini-4-carbon"
            protocol: "antigravity"
            not-exist: ["generationConfig.thinkingConfig"]
          - name: "claude-opus-4-6-thinking"
            protocol: "antigravity"
            not-exist: ["generationConfig.thinkingConfig"]
          - name: "claude-sonnet-4-6"
            protocol: "antigravity"
            not-exist: ["generationConfig.thinkingConfig"]
          - name: "gemini-3.8-flash"
            protocol: "antigravity"
            not-exist: ["generationConfig.thinkingConfig"]
          - name: "gemini-4-argon"
            protocol: "antigravity"
            not-exist: ["generationConfig.thinkingConfig"]
        params:
          "generationConfig.thinkingConfig.includeThoughts": true
          "generationConfig.thinkingConfig.thinkingBudget": -1
      - models:
          - name: "gemini-4-hydrogen-high"
            protocol: "antigravity"
            not-exist: ["generationConfig.thinkingConfig"]
          - name: "gemini-4-carbon-high"
            protocol: "antigravity"
            not-exist: ["generationConfig.thinkingConfig"]
        params:
          "generationConfig.thinkingConfig.includeThoughts": true
          "generationConfig.thinkingConfig.thinkingLevel": "high"
      - models:
          - name: "gemini-4-hydrogen-xhigh"
            protocol: "antigravity"
            not-exist: ["generationConfig.thinkingConfig"]
        params:
          "generationConfig.thinkingConfig.includeThoughts": true
          "generationConfig.thinkingConfig.thinkingLevel": "xhigh"
    override:
      - models:
          - name: "gemini-4-hydrogen-low"
            protocol: "antigravity"
          - name: "gemini-4-carbon-low"
            protocol: "antigravity"
          - name: "gemini-3.8-flash-low"
            protocol: "antigravity"
          - name: "gemini-4-argon-low"
            protocol: "antigravity"
        params:
          "generationConfig.thinkingConfig.includeThoughts": true
          "generationConfig.thinkingConfig.thinkingLevel": "low"
      - models:
          - name: "gemini-4-hydrogen-medium"
            protocol: "antigravity"
          - name: "gemini-4-carbon-medium"
            protocol: "antigravity"
          - name: "gemini-3.8-flash-medium"
            protocol: "antigravity"
          - name: "gemini-4-argon-medium"
            protocol: "antigravity"
        params:
          "generationConfig.thinkingConfig.includeThoughts": true
          "generationConfig.thinkingConfig.thinkingLevel": "medium"

oauth:
  auth-dir: "/root/.cli-proxy-api"   # = /opt/agy-me/cpa/auths on the host
  model-alias:
    antigravity:                     # plain xxx is a fork of xxx-high/xhigh; -low / -medium are real upstream models
      - name: "gemini-4-carbon-high"
        alias: "gemini-4-carbon"
        fork: true
      - name: "gemini-4-hydrogen-xhigh"
        alias: "gemini-4-hydrogen"
        fork: true
      - name: "gemini-3.8-flash-high"
        alias: "gemini-3.8-flash"
        fork: true
      - name: "gemini-4-argon-high"
        alias: "gemini-4-argon"
        fork: true

observability:
  logs:
    request-log: false
    logging-to-file: false
  usage:
    usage-statistics-enabled: true            # agy-me's request log drains this queue
    redis-usage-queue-retention-seconds: 300  # survives an agy-me restart of a few minutes

plugins:
  enabled: false
