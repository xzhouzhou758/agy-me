# /opt/agy-me/docker-compose.yml (示例编排：支持 CPA + 可选内置 AGM / AI Studio 2)
services:
  cpa:
    image: eceasy/cli-proxy-api:v8.0.74
    container_name: agy-me-cpa
    network_mode: host
    volumes:
      - ./cpa/config.yaml:/CLIProxyAPI/config.yaml
      - ./cpa/auths:/root/.cli-proxy-api
      - ./cpa/logs:/CLIProxyAPI/logs
      - ./cpa/catalog:/CLIProxyAPI/catalog:ro
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  agm:
    image: lbjlaq/antigravity-manager:latest
    container_name: agy-me-agm
    profiles: ["agm"]
    ports:
      - "127.0.0.1:8319:8045"
    environment:
      PORT: "8045"
      API_KEY: "${AGM_API_KEY}"
      WEB_PASSWORD: "${AGM_ADMIN_PASSWORD}"
    volumes:
      - ./agm:/root/.antigravity_tools
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  aistudio2:
    image: ghcr.io/mag1cfall/aistudio2api:latest
    container_name: agy-me-aistudio2
    profiles: ["aistudio2"]
    init: true
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      LISTEN_ADDR: 127.0.0.1:18803
      PROXY_API_KEY: "${AISTUDIO2_KEY}"
      ADMIN_AUTH_ENABLED: "true"
      ADMIN_USERNAME: "${AISTUDIO2_ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${AISTUDIO2_ADMIN_PASSWORD}"
      AUTO_START: "true"
      WAA_BACKEND: spidermonkey
      WARM_WORKER_LIMIT: "2"
      MAX_ACTIVE_WORKERS: "6"
    volumes:
      - ./data/aistudio2api:/data
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  agy-me:
    build: .
    image: ghcr.io/xzhouzhou758/agy-me:latest
    container_name: agy-me
    network_mode: host
    env_file: ./agy-me.env
    environment:
      HOST: 127.0.0.1
      PORT: "8321"
      BASE_PATH: /me
    volumes:
      - ./cpa/catalog:/app/catalog
      - ./data:/app/data
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
